[project]
name = "game-ai-agent"
version = "0.1.0"
description = "Headless turn-based tactics engine with seeded defects, hunted by an LLM agent with task planning and external memory."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
rl = ["torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
